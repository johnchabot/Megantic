<svg xmlns="http://w3.org" viewBox="0 0 620 540" width="100%" height="100%" style="background:#2a2e2f;">
  <!--
    ===================================================================
    PRODUCTION-READY TRIPLE-CONVERGENCE DOUBLE-HELIX MASTER MATRIX
    ===================================================================
    - Framework: 10 Columns wide (18px steps) x 12 Rows high (30px steps).
    - Dimensions: 180px Wide x 360px Tall (Attic: -15px, Basement: +15px).
    - Engine 1 (Orange): Rigid loop enclosures extending OUT past baseline borders.
    - Engine 2 (Blue): Expansive relaxed double-helix converging at Rows 1, 6.5, 12.
    - Hierarchy: "Orange Wins" priority layout. 10-column mask slices over top.
    ===================================================================
  -->

  <defs>
    <!-- ENGINE 1 PROFILES: Cloned Rigid Orange Counter Tracks (Extending OUT) -->
    <path id="orange-loop" d="M 0,180 L 0,90 C 0,10 20,-15 90,-15 L 90,15 C 45,15 30,45 30,90 L 30,180 Z" />

    <!-- ENGINE 2 PROFILES: Cloned Relaxed Blue Double-Helix Tracks (Triple Convergence) -->
    <path id="blue-swoosh" d="M 0,-15 C 30,-15 50,30 90,30 C 130,30 140,135 90,195 C 40,255 50,360 90,360 C 130,360 150,375 180,375" fill="none" stroke-width="26" />

    <!-- INTEGRATED HARWARE MATRIX BACKING PANEL (Shared Chassis Blueprint) -->
    <g id="chassis-backing-panel">
      <rect x="0" y="-15" width="180" height="390" fill="#141617" stroke="#0d0e0f" stroke-width="3" />
      <!-- Horizontal and Vertical Subdued Copper Guide Grid network -->
      <line x1="18"  y1="-15" x2="18"  y2="375" fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
      <line x1="36"  y1="-15" x2="36"  y2="375" fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
      <line x1="54"  y1="-15" x2="54"  y2="375" fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
      <line x1="72"  y1="-15" x2="72"  y2="375" fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
      <line x1="90"  y1="-15" x2="90"  y2="375" fill="none" stroke="#4b5354" stroke-width="1.8" />
      <line x1="108" y1="-15" x2="108" y2="375" fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
      <line x1="126" y1="-15" x2="126" y2="375" fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
      <line x1="144" y1="-15" x2="144" y2="375" fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
      <line x1="162" y1="-15" x2="162" y2="375" fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
      <line x1="0"   y1="0"   x2="180" y2="0"   fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
      <line x1="0"   y1="30"  x2="180" y2="30"  fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
      <line x1="0"   y1="60"  x2="180" y2="60"  fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
      <line x1="0"   y1="90"  x2="180" y2="90"  fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
      <line x1="0"   y1="120" x2="180" y2="120" fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
      <line x1="0"   y1="150" x2="180" y2="150" fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
      <line x1="0"   y1="180" x2="180" y2="180" fill="none" stroke="#4b5354" stroke-width="1.8" />
      <line x1="0"   y1="210" x2="180" y2="210" fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
      <line x1="0"   y1="240" x2="180" y2="240" fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
      <line x1="0"   y1="270" x2="180" y2="270" fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
      <line x1="0"   y1="300" x2="180" y2="300" fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
      <line x1="0"   y1="330" x2="180" y2="330" fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
      <line x1="0"   y1="360" x2="180" y2="360" fill="none" stroke="#4b5354" stroke-width="1.2" stroke-dasharray="2,3" />
    </g>

    <!-- PHYSICAL MASK CUTTER OVERLAY (Slices curves into addressable bricks) -->
    <g id="mechanical-slice-mask">
      <line x1="0" y1="30"  x2="180" y2="30"  stroke="#2a2e2f" stroke-width="3" />
      <line x1="0" y1="60"  x2="180" y2="60"  stroke="#2a2e2f" stroke-width="3" />
      <line x1="0" y1="90"  x2="180" y2="90"  stroke="#2a2e2f" stroke-width="3" />
      <line x1="0" y1="120" x2="180" y2="120" stroke="#2a2e2f" stroke-width="3" />
      <line x1="0" y1="150" x2="180" y2="150" stroke="#2a2e2f" stroke-width="3" />
      <line x1="0" y1="210" x2="180" y2="210" stroke="#2a2e2f" stroke-width="3" />
      <line x1="0" y1="240" x2="180" y2="240" stroke="#2a2e2f" stroke-width="3" />
      <line x1="0" y1="270" x2="180" y2="270" stroke="#2a2e2f" stroke-width="3" />
      <line x1="0" y1="300" x2="180" y2="300" stroke="#2a2e2f" stroke-width="3" />
      <line x1="0" y1="330" x2="180" y2="330" stroke="#2a2e2f" stroke-width="3" />
      <line x1="18" y1="0"  x2="18"  y2="360" stroke="#2a2e2f" stroke-width="3" />
      <line x1="54" y1="0"  x2="54"  y2="360" stroke="#2a2e2f" stroke-width="3" />
      <line x1="126" y1="0" x2="126" y2="360" stroke="#2a2e2f" stroke-width="3" />
      <line x1="162" y1="0" x2="162" y2="360" stroke="#2a2e2f" stroke-width="3" />
    </g>
  </defs>

  <!-- ==================== PANEL 1: UNLIT CHASSIS MESH (LEFT) ==================== -->
  <g transform="translate(40, 70)">
    <use href="#chassis-backing-panel" />

    <!-- Unlit Blue Double-Helix Waves (Continuous trajectory) -->
    <g fill="none" stroke="#180f07" stroke-width="30" stroke-linecap="round">
      <use href="#blue-swoosh" />
      <use href="#blue-swoosh" transform="translate(180,0) scale(-1,1)" />
    </g>

    <!-- Unlit Orange Primary Loop Tracks ("Orange Wins" Overlap) -->
    <g fill="#141617" stroke="#180f07" stroke-width="2.2">
      <use href="#orange-loop" />
      <use href="#orange-loop" transform="translate(180,0) scale(-1,1)" />
      <use href="#orange-loop" transform="translate(0,390) scale(1,-1)" />
      <use href="#orange-loop" transform="translate(180,390) scale(-1,-1)" />
    </g>

    <use href="#mechanical-slice-mask" />
    <text x="90" y="405" text-anchor="middle" fill="#4b5354" font-family="monospace" font-size="12px" font-weight="bold" letter-spacing="1px">1. CHASSIS MESH</text>
  </g>

  <!-- ==================== PANEL 2: ACTIVE REFINED DISPLAY FIELD (RIGHT) ==================== -->
  <g transform="translate(360, 70)">
    <use href="#chassis-backing-panel" />

    <!-- Active Blue Triple-Convergence Helix (Engine 2) -->
    <g fill="none" stroke="#ffa500" stroke-width="26" stroke-linecap="round" filter="brightness(1.3) drop-shadow(0px 0px 6px rgba(255,165,0,0.9))">
      <use href="#blue-swoosh" />
      <use href="#blue-swoosh" transform="translate(180,0) scale(-1,1)" />
    </g>

    <!-- Active Dominant Orange Loops (Engine 1 - Overwrite Overlap Priority) -->
    <g fill="#ffa500" stroke="#000000" stroke-width="1.5" filter="brightness(1.3) drop-shadow(0px 0px 6px rgba(255,165,0,0.9))">
      <use href="#orange-loop" />
      <use href="#orange-loop" transform="translate(180,0) scale(-1,1)" />
      <use href="#orange-loop" transform="translate(0,390) scale(1,-1)" />
      <use href="#orange-loop" transform="translate(180,390) scale(-1,-1)" />
    </g>

    <use href="#mechanical-slice-mask" />
    <text x="90" y="405" text-anchor="middle" fill="#4b5354" font-family="monospace" font-size="12px" font-weight="bold" letter-spacing="1px">2. FINAL IMPRINT "8"</text>
  </g>
</svg>
